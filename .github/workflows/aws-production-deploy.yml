name: Production Deploy to AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 541259832110.dkr.ecr.ap-south-1.amazonaws.com
  API_SERVICE_NAME: spin-api
  AGENT_SERVICE_NAME: spin-agent

jobs:
  deploy-backend:
    name: Build, Push & Deploy Backend Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ── Docker Layer Cache ──────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── AWS Auth ───────────────────────────────────────────────────────────
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & Push Agent Image ───────────────────────────────────────────
      - name: Build and Push Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.agent
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.AGENT_SERVICE_NAME }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.AGENT_SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.AGENT_SERVICE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.AGENT_SERVICE_NAME }}:cache,mode=max

      # ── Build & Push API Image ─────────────────────────────────────────────
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.API_SERVICE_NAME }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.API_SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.API_SERVICE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.API_SERVICE_NAME }}:cache,mode=max

      # ── Download Current Task Definition ────────────────────────────────────
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition spin-api \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition > task-definition.json

      # ── Render New Task Definition ──────────────────────────────────────────
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: spin-api
          image: ${{ env.ECR_REGISTRY }}/${{ env.API_SERVICE_NAME }}:${{ github.sha }}

      # ── Deploy to Amazon ECS ──────────────────────────────────────────────
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: spin-api-service-v2
          cluster: spin-prod
          wait-for-service-stability: true